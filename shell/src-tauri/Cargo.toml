[package]
name = "molink"
version = "0.1.0"
description = "moLink desktop shell"
authors = ["moLink Contributors"]
edition = "2021"
rust-version = "1.77"

# The lib target is what mobile (phase 2) will consume; the desktop binary is a
# thin main.rs around it.
[lib]
name = "molink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
