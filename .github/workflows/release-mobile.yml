name: Release Mobile

# 第二阶段：**签名**包（Play 上架用）。日常可安装的 APK 已经随 Release Desktop
# 一起发（debug 签名，见 release-desktop.yml 的 android job），这里只做商店签名。
#
# 启用前需要这些 secret：
#
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#
# iOS 先走 TestFlight；把 .ipa 挂到 GitHub Release 还需要证书与描述文件。
#
# 注意：下面这条 `pnpm tauri android build` 是早期 Tauri 壳的写法，当前的安卓壳
# 是 mobile/android 这个独立 Gradle 工程 —— 启用前把构建步骤改成
# `./gradlew :app:assembleRelease`（带上面的 keystore 参数），否则这条流水线跑不起来。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm tauri android build --apk --aab
        working-directory: shell

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            shell/gen/android/app/build/outputs/apk/release/*.apk
            shell/gen/android/app/build/outputs/bundle/release/*.aab
