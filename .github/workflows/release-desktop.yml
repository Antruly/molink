name: Release Desktop

on:
  push:
    tags: ['v*']
  # Manual runs build the artifacts without publishing a release; the release
  # steps below only fire for a tag.
  workflow_dispatch:
    inputs:
      skip_slow:
        description: 'Only run the Windows jobs (skip Linux and macOS)'
        type: boolean
        default: false

permissions:
  contents: write

# A tag names the release; a manual run still builds (and uploads) the same
# artifacts, using the version in backend/src/version.h. Without this, manual
# runs produced packages named after the branch ("main").
env:
  PKG_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.10.0' }}

# Linux and Windows download the prebuilt libuvcpp archive (UVCPP_VERSION,
# default 1.8.7); macOS has no prebuilt asset yet and builds it from the
# UVCPP_REPO repository variable. Then the core, frontend and platform shell
# are built and attached to the release.
jobs:
  linux:
    # workflow_dispatch may skip the two slow Unix jobs while iterating on a
    # Windows fix; tag builds never set the input and always run everything.
    if: ${{ inputs.skip_slow != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # The Azure mirror is sometimes very slow (a few hundred KB/s,
          # webkit2gtk alone is 25 MB). Keep retries and a per-read timeout,
          # but give the install a generous overall budget instead of killing
          # it mid-download.
          APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=5"
          sudo timeout 900 apt-get update $APT_OPTS
          sudo timeout 2400 apt-get install -y $APT_OPTS cmake libgtk-3-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf libuv1-dev libssl-dev \
            zlib1g-dev curl rpm libsvtav1-dev libdav1d-dev libjpeg-turbo8-dev \
            libvpx-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # WebTransport needs libuvcpp's 1.9 line (the session type shipped there),
      # and that line's QUIC/HTTP3 needs the OpenSSL 3.5 QUIC API, which no
      # Ubuntu package provides. So both are built from source here.
      - name: Build OpenSSL 3.5 (QUIC API)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSL --retry 3 --retry-delay 5 -o openssl.tar.gz \
            https://codeload.github.com/openssl/openssl/tar.gz/refs/tags/openssl-3.5.0
          mkdir -p openssl-src
          tar xzf openssl.tar.gz -C openssl-src --strip-components=1
          cd openssl-src
          ./Configure --prefix="$RUNNER_TEMP/openssl-quic" --libdir=lib no-shared no-tests
          make -j"$(nproc)"
          make install_sw
          # The build is static (no-shared), so the symbol lives in libssl.a;
          # a shared build would expose it through libssl.so's dynamic table.
          if [ -f "$RUNNER_TEMP/openssl-quic/lib/libssl.so" ]; then
            nm -D "$RUNNER_TEMP/openssl-quic/lib/libssl.so"
          else
            nm "$RUNNER_TEMP/openssl-quic/lib/libssl.a"
          fi | grep -qE ' [TW] SSL_set_quic_tls_cbs($|@)' || {
            echo "::error title=quic-openssl::libssl has no SSL_set_quic_tls_cbs"; exit 1; }

      - name: Build libuvcpp (1.9 line, WebTransport)
        shell: bash
        env:
          UVCPP_REF: ${{ vars.UVCPP_REF }}
        run: |
          set -euo pipefail
          ./packaging/clone-retry.sh --depth 1 --branch "${UVCPP_REF:-master}" \
            https://github.com/Antruly/libuvcpp.git "$RUNNER_TEMP/libuvcpp"
          cmake -S "$RUNNER_TEMP/libuvcpp" -B "$RUNNER_TEMP/libuvcpp/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp" \
            -DUVCPP_BUILD_SHARED=ON -DUVCPP_BUILD_STATIC=OFF -DUVCPP_BUILD_TESTS=OFF \
            -DUVCPP_BUILD_NET=ON -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
            -DUVCPP_ENABLE_OPENSSL=ON -DUVCPP_ENABLE_QUIC=ON -DUVCPP_ENABLE_HTTP3=ON \
            -DOPENSSL_USE_STATIC_LIBS=ON -DOPENSSL_ROOT_DIR="$RUNNER_TEMP/openssl-quic"
          cmake --build "$RUNNER_TEMP/libuvcpp/build" --parallel
          cmake --install "$RUNNER_TEMP/libuvcpp/build"
          test -f "$RUNNER_TEMP/uvcpp/include/http3/uvcpp_h3_wt_session.h" || {
            echo "::error title=webtransport::libuvcpp has no WebTransport header"; exit 1; }

      - name: Build libdatachannel (WebRTC)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.22.6 --recurse-submodules --shallow-submodules \
            https://github.com/paullouisageneau/libdatachannel.git "$RUNNER_TEMP/libdatachannel"
          cmake -S "$RUNNER_TEMP/libdatachannel" -B "$RUNNER_TEMP/libdatachannel/build" \
            -DCMAKE_BUILD_TYPE=Release -DNO_EXAMPLES=ON -DNO_TESTS=ON \
            -DUSE_GNUTLS=OFF -DUSE_NICE=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/datachannel"
          cmake --build "$RUNNER_TEMP/libdatachannel/build" --parallel
          cmake --install "$RUNNER_TEMP/libdatachannel/build"

      - name: Build packages
        env:
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/uvcpp:${{ runner.temp }}/datachannel
          PKG_CONFIG_PATH: ${{ runner.temp }}/uvcpp/lib/pkgconfig
          UVCPP_LIB_DIR: ${{ runner.temp }}/uvcpp/lib
          UVCPP_ROOT: ${{ runner.temp }}/uvcpp
          VERSION: ${{ env.PKG_VERSION }}
        run: |
          export VERSION="${VERSION#v}"
          export MOLINK_EXTRA_CMAKE_ARGS="-DMOLINK_UVCPP_PREFIX=$RUNNER_TEMP/uvcpp -DMOLINK_ENABLE_WEBRTC=ON -DOPENSSL_ROOT_DIR=$RUNNER_TEMP/openssl-quic -DOPENSSL_USE_STATIC_LIBS=ON"
          ./packaging/linux/build-deb.sh
          ./packaging/linux/build-appimage.sh
          ./packaging/linux/build-rpm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: moLink-linux
          if-no-files-found: error
          path: |
            build/package/*.deb
            build/package/*.AppImage
            build/package/*.rpm

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          name: moLink ${{ github.ref_name }}
          body: 'Linux packages: .deb, .AppImage and .rpm.'
          files: |
            build/package/*.deb
            build/package/*.AppImage
            build/package/*.rpm

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Fetch prebuilt libuvcpp
        shell: bash
        env:
          UVCPP_VERSION: ${{ vars.UVCPP_VERSION }}
        run: ./packaging/fetch-uvcpp.sh msvc-x64 "${UVCPP_VERSION:-1.9.1}" "$RUNNER_TEMP/uvcpp"

      # The archive ships zlib.h (libuvcpp's public headers include it) but no
      # zlib library, and molink compresses tiles itself. Build a static zlib
      # so the package needs no extra zlib.dll.
      # The per-device certificate support links OpenSSL. The runner images
      # usually ship OpenSSL 3 under Program Files; install it if missing. The
      # runtime DLLs (libssl-3-x64.dll/libcrypto-3-x64.dll) already come from
      # the libuvcpp archive staged next to the core.
      - name: Ensure OpenSSL 3
        shell: pwsh
        run: |
          # Pin OpenSSL 3.5.x: the libuvcpp archive stages libssl-3-x64.dll /
          # libcrypto-3-x64.dll, and molink-core links those. The Shining Light
          # installer puts the development files under C:\OpenSSL-Win64.
          $roots = @('C:\OpenSSL-Win64', 'C:\Program Files\OpenSSL-Win64', 'C:\Program Files\OpenSSL')
          function Find-OpenSsl {
            $roots | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
          }
          $root = Find-OpenSsl
          if (-not $root) {
            $url = 'https://slproweb.com/download/Win64OpenSSL-3_5_1.exe'
            $exe = Join-Path $env:RUNNER_TEMP 'Win64OpenSSL-3_5_1.exe'
            try {
              Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
              Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=C:\OpenSSL-Win64" -Wait
            } catch {
              Write-Warning "OpenSSL 3.5.1 install failed: $_"
            }
            $root = Find-OpenSsl
          }
          if (-not $root) {
            choco install openssl --no-progress -y
            $root = Find-OpenSsl
          }
          if (-not $root) { throw 'OpenSSL development files were not installed' }
          "OPENSSL_ROOT_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      # SVT-AV1 encodes large changed rectangles on the host; dav1d decodes
      # them on clients. vcpkg builds both from source.
      - name: Install AV1 libraries
        shell: bash
        run: |
          # libjpeg-turbo pulls vcpkg's zlib in; the core takes that zlib too,
          # so headers and import library agree (a static zlib built here used
          # to collide with vcpkg's headers: unresolved __imp_compress2).
          # libdatachannel carries the WebRTC video track and data channels.
          # The `srtp` feature is not optional here: the port maps it through
          # INVERTED_FEATURES to NO_MEDIA, so a plain `libdatachannel` is built
          # without media support -- no rtc::H264RtpPacketizer for the video
          # track, and the core does not even compile.
          # libuvcpp 1.9 supplies WebTransport/HTTP3 here: its archive ships
          # http3/uvcpp_h3_wt_session.h with UVCPP_HTTP3_ENABLE=1, so the core
          # enables its WebTransport transport on Windows too.
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install \
            svt-av1:x64-windows dav1d:x64-windows libjpeg-turbo:x64-windows \
            libvpx:x64-windows "libdatachannel[srtp]:x64-windows"

      - name: Build core
        shell: bash
        run: |
          cmake -S backend -B backend/build \
            -DMOLINK_UVCPP_PREFIX="$(cygpath -m "$RUNNER_TEMP/uvcpp")" \
            -DOPENSSL_ROOT_DIR="$(cygpath -m "$OPENSSL_ROOT_DIR")" \
            -DMOLINK_ENABLE_AV1=ON \
            -DMOLINK_ENABLE_VPX=ON \
            -DMOLINK_REQUIRE_VPX=ON \
            -DMOLINK_REQUIRE_DAV1D=ON \
            -DMOLINK_ENABLE_WEBRTC=ON \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$VCPKG_INSTALLATION_ROOT/installed/x64-windows")"
          cmake --build backend/build --config Release --parallel

      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          $version = '1.0.4258.31'
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg"
          Invoke-WebRequest -Uri $url -OutFile wv2.zip
          Expand-Archive wv2.zip -DestinationPath wv2

      - name: Build shell
        shell: bash
        run: |
          cmake -S shell/windows -B shell/windows/build \
            -DWEBVIEW2_SDK="$(cygpath -w "$GITHUB_WORKSPACE/wv2")"
          cmake --build shell/windows/build --config Release --parallel

      - name: Build experimental session components
        shell: bash
        run: |
          cmake -S shell/windows/service -B shell/windows/service/build
          cmake --build shell/windows/service/build --config Release --parallel
          cmake -S shell/windows/helper -B shell/windows/helper/build
          cmake --build shell/windows/helper/build --config Release --parallel

      - name: Stage and build packages
        shell: bash
        run: |
          export UVCPP_LIB_DIR="$(cygpath -u "$RUNNER_TEMP/uvcpp/bin")"
          bash packaging/windows/stage.sh
          choco install innosetup nsis -y --no-progress
          mkdir -p build/package
          VERSION="${PKG_VERSION#v}"
          PKG_DIR="$(cygpath -w "$GITHUB_WORKSPACE/build/windows/pkg")"
          OUT_DIR="$(cygpath -w "$GITHUB_WORKSPACE/build/package")"
          LANG_FILE="$(cygpath -w "$GITHUB_WORKSPACE/packaging/windows/ChineseSimplified.isl")"

          ISCC=$(command -v iscc || true)
          if [ -z "$ISCC" ] || [ ! -x "$ISCC" ]; then
            ISCC=$(find "/c/Program Files (x86)" "/c/Program Files" \
              -maxdepth 2 -iname ISCC.exe 2>/dev/null | head -n 1)
          fi
          if [ -z "$ISCC" ] || [ ! -x "$ISCC" ]; then
            echo "Inno Setup compiler not found" >&2
            exit 1
          fi

          # The installer uses Inno Setup; the portable single-file exe still
          # uses NSIS's silent-extract stub.
          MSYS2_ARG_CONV_EXCL='*' MSYS_NO_PATHCONV=1 \
            "$ISCC" /DAppVersion="$VERSION" /DPkgDir="$PKG_DIR" \
            /DOutputDir="$OUT_DIR" /DLangFile="$LANG_FILE" \
            packaging/windows/installer.iss
          MSYS2_ARG_CONV_EXCL='*' MSYS_NO_PATHCONV=1 \
            "/c/Program Files (x86)/NSIS/makensis.exe" /DVERSION="$VERSION" \
            /DPKG_DIR="$PKG_DIR" /DOUT_DIR="$OUT_DIR" \
            packaging/windows/portable.nsi

      # The native Direct2D shell: same staged tree, MinGW-w64 build, packaged
      # with the same installer/launcher scripts (AppExeName=moLink-native.exe).
      - name: Build the native shell (x64)
        shell: pwsh
        run: |
          choco install msys2 -y --no-progress
          # Chocolatey deploys MSYS2 to C:\tools\msys64, while some runner
          # images also carry a C:\msys64. The toolchain must come from the
          # root whose pacman actually installed it, so try both and verify the
          # compiler before using it.
          $msysRoot = $null
          $mingw = $null
          $windres = $null
          $gxx = $null
          foreach ($candidate in @('C:\tools\msys64', 'C:\msys64')) {
            $bash = Join-Path $candidate 'usr\bin\bash.exe'
            if (-not (Test-Path $bash)) { continue }
            Write-Host "== trying MSYS2 at $candidate"
            # The mirror can be slow; a partial transaction used to leave a
            # half-installed toolchain. Disable the per-read timeout and retry.
            & $bash -lc "pacman -Sy --noconfirm --needed --disable-download-timeout mingw-w64-x86_64-gcc"
            $candidateGxx = Join-Path $candidate 'mingw64\bin\x86_64-w64-mingw32-g++.exe'
            if (-not (Test-Path $candidateGxx)) {
              Write-Warning "mingw g++ is missing under $candidate (exit $LASTEXITCODE)"
              continue
            }
            $msysRoot = $candidate
            $mingw = Join-Path $candidate 'mingw64'
            $gxx = $candidateGxx
            $windres = Get-ChildItem (Join-Path $mingw 'bin') -Filter '*windres*.exe' |
              Select-Object -First 1 -ExpandProperty FullName
            break
          }
          if ($null -eq $msysRoot) { throw 'no usable MSYS2 MinGW toolchain was found' }
          Write-Host "== using MSYS2 at $msysRoot"
          if (-not $windres) {
            # binutils normally arrives with gcc; ask for it explicitly if the
            # naming differs from the expected prefixed binary.
            & (Join-Path $msysRoot 'usr\bin\bash.exe') -lc "pacman -S --noconfirm --needed --disable-download-timeout mingw-w64-x86_64-binutils"
            $windres = Get-ChildItem (Join-Path $mingw 'bin') -Filter '*windres*.exe' |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $windres) { throw "no windres found under $mingw" }
          # WebP is only used for the remote device avatar. Its package pulls a
          # large dependency set and the mirror occasionally times out, so it
          # is best-effort: without it the shell falls back to initial-letter
          # avatars instead of failing the whole release.
          $haveWebp = Test-Path (Join-Path $mingw 'lib\libwebp.a')
          for ($attempt = 0; $attempt -lt 3 -and -not $haveWebp; $attempt++) {
            & (Join-Path $msysRoot 'usr\bin\bash.exe') -lc "pacman -S --noconfirm --needed --disable-download-timeout mingw-w64-x86_64-libwebp"
            $haveWebp = Test-Path (Join-Path $mingw 'lib\libwebp.a')
          }
          if ($haveWebp) { Write-Host '== libwebp found' } else { Write-Warning 'libwebp unavailable; building without WebP avatars' }
          $mingwInc = Join-Path $mingw 'include'
          $mingwLib = Join-Path $mingw 'lib'
          & $windres -O coff -I . shell/windows/ui_kit_demo.rc -o "$env:RUNNER_TEMP\native-res.o"
          if ($LASTEXITCODE -ne 0) { throw 'native resources failed' }
          $common = @(
            '-std=c++20', '-D_WIN32_WINNT=0x0A00', '-O2', '-mwindows', '-municode', '-static',
            '-I', 'shell/windows', "-I$mingwInc",
            '-o', 'build\windows\pkg\moLink-native.exe',
            'shell/windows/ui_kit_demo.cpp', 'shell/windows/ui_kit.cpp',
            'shell/windows/ws_client.cpp', 'shell/windows/session_client.cpp',
            'shell/windows/puff.c', "$env:RUNNER_TEMP\native-res.o",
            "-L$mingwLib"
          )
          $tail = @('-ld2d1', '-ldwrite', '-lole32', '-luser32', '-lgdi32', '-ladvapi32',
                    '-lwindowscodecs', '-lcomdlg32', '-lws2_32', '-lwinhttp', '-lshell32')
          if ($haveWebp) {
            $gccArgs = $common + @('-DMOLINK_HAVE_WEBP', '-lwebp', '-lsharpyuv') + $tail
          } else {
            $gccArgs = $common + $tail
          }
          & $gxx @gccArgs
          if ($LASTEXITCODE -ne 0) { throw 'native shell did not build' }
          if (-not (Test-Path build\windows\pkg\moLink-native.exe)) { throw 'native shell did not build' }

      - name: Package the native client (x64)
        shell: bash
        run: |
          VERSION="${PKG_VERSION#v}"
          PKG_DIR="$(cygpath -w "$GITHUB_WORKSPACE/build/windows/pkg")"
          OUT_DIR="$(cygpath -w "$GITHUB_WORKSPACE/build/package")"
          LANG_FILE="$(cygpath -w "$GITHUB_WORKSPACE/packaging/windows/ChineseSimplified.isl")"
          ISCC=$(find "/c/Program Files (x86)" "/c/Program Files" -maxdepth 2 -iname ISCC.exe 2>/dev/null | head -n 1)
          MSYS2_ARG_CONV_EXCL='*' MSYS_NO_PATHCONV=1 \
            "$ISCC" /DAppVersion="$VERSION" /DPkgDir="$PKG_DIR" \
            /DOutputDir="$OUT_DIR" /DLangFile="$LANG_FILE" \
            /DAppExeName=moLink-native.exe \
            /DOutputName="moLink-$VERSION-native-setup-x64" \
            packaging/windows/installer.iss
          MSYS2_ARG_CONV_EXCL='*' MSYS_NO_PATHCONV=1 \
            "/c/Program Files (x86)/NSIS/makensis.exe" /DVERSION="$VERSION" \
            /DPKG_DIR="$PKG_DIR" /DOUT_DIR="$OUT_DIR" \
            /DAPP_EXE=moLink-native.exe \
            /DOUT_NAME="moLink-$VERSION-native-portable-x64.exe" \
            packaging/windows/portable.nsi
          # The WebView2 installer already packed the staged tree; it must not
          # pick up moLink-native.exe, so it is built before this step and the
          # native setup uses its own output name.

      # The release promises four x64 Windows artifacts; fail here (not in the
      # upload step) with a clear message if one of them was not produced.
      - name: Verify the four x64 artifacts
        shell: bash
        run: |
          VERSION="${PKG_VERSION#v}"
          for name in "$VERSION-setup-x64.exe" "$VERSION-portable-x64.exe" \
                      "$VERSION-native-setup-x64.exe" \
                      "$VERSION-native-portable-x64.exe"; do
            test -f "build/package/moLink-$name" || {
              echo "::error title=missing-artifact::build/package/moLink-$name was not produced"
              ls -l build/package
              exit 1
            }
          done
          ls -l build/package

      # A package that silently lost a runtime DLL (jpeg62.dll and the zlib
      # runtime went missing this way) installs but cannot start. Check the
      # staged binaries' imports before anything is published -- every one of
      # them, not just the core: a DLL that is present but pulls in a missing
      # one (datachannel.dll needs juice.dll) breaks the package just the same.
      - name: Verify runtime dependencies
        shell: pwsh
        run: |
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin not found" }
          $pkg = "build/windows/pkg"
          if (-not (Test-Path (Join-Path $pkg "molink-core.exe"))) { throw "molink-core.exe is not staged" }
          $systemDir = Join-Path $env:SystemRoot "System32"
          $binaries = @(Get-ChildItem $pkg -File |
            Where-Object { $_.Extension -in '.exe', '.dll' } |
            ForEach-Object FullName)
          $missing = @()
          foreach ($binary in $binaries) {
            $names = & $dumpbin /nologo /dependents $binary |
              Select-String -Pattern '^\s+([^\s]+\.dll)$' |
              ForEach-Object { $_.Matches[0].Groups[1].Value.ToLower() }
            foreach ($name in $names) {
              if ($name -like 'api-ms-win-*' -or $name -like 'ext-ms-*') { continue }
              if (Test-Path (Join-Path $systemDir $name)) { continue }
              if (Test-Path (Join-Path $pkg $name)) { continue }
              $missing += $name
            }
          }
          $missing = @($missing | Sort-Object -Unique)
          if ($missing.Count -gt 0) {
            throw ("the package is missing runtime DLLs: " + ($missing -join ", "))
          }
          Write-Host "runtime dependencies OK"

      - uses: actions/upload-artifact@v4
        with:
          name: moLink-windows-x64
          if-no-files-found: error
          path: build/package/*.exe

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          name: moLink ${{ github.ref_name }}
          body: 'Windows installer (Inno Setup) and portable executable (x64).'
          files: build/package/*.exe

  # Temporarily disabled during the test phase (macOS runners are scarce).
  macos:
    if: ${{ inputs.skip_slow != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install OpenSSL and AV1
        run: brew install openssl@3 svt-av1 dav1d jpeg libvpx

      - name: Build libuvcpp
        shell: bash
        run: |
          if [ -z "${{ vars.UVCPP_REPO }}" ]; then
            echo "::error::Set the UVCPP_REPO repository variable."
            exit 1
          fi
          REF="${{ vars.UVCPP_REF }}"; REF="${REF:-main}"
          ./packaging/clone-retry.sh --depth 1 --branch "$REF" "${{ vars.UVCPP_REPO }}" "$RUNNER_TEMP/libuvcpp"
          cmake -S "$RUNNER_TEMP/libuvcpp" -B "$RUNNER_TEMP/libuvcpp/build" \
            -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
            -DUVCPP_ENABLE_OPENSSL=ON \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp"
          cmake --build "$RUNNER_TEMP/libuvcpp/build" --parallel
          cmake --install "$RUNNER_TEMP/libuvcpp/build"
          cfg="$RUNNER_TEMP/uvcpp/include/uvcpp/uvcpp_config.h"
          grep -qE "^#[[:space:]]*define[[:space:]]+UVCPP_OPENSSL_ENABLE[[:space:]]+1" "$cfg" || {
            echo "::error::UVCPP_OPENSSL_ENABLE is not enabled in libuvcpp"
            exit 1
          }

      - name: Install libuv into the prefix
        shell: bash
        run: |
          ./packaging/clone-retry.sh --depth 1 https://github.com/libuv/libuv.git "$RUNNER_TEMP/libuv"
          cmake -S "$RUNNER_TEMP/libuv" -B "$RUNNER_TEMP/libuv/build" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp" -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/libuv/build" --target install

      - name: Build app and dmg
        env:
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/uvcpp
          UVCPP_LIB_DIR: ${{ runner.temp }}/uvcpp/lib
          VERSION: ${{ env.PKG_VERSION }}
          ARCH: ${{ matrix.arch }}
        run: |
          export VERSION="${VERSION#v}"
          export OPENSSL_LIB_DIR="$(brew --prefix openssl@3)/lib"
          ./packaging/macos/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: moLink-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: build/package/*.dmg

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          name: moLink ${{ github.ref_name }}
          body: 'macOS disk image.'
          files: build/package/*.dmg

  # Windows 7 x86 ships in the same release as the other platforms.
  # Cross-built i686 codec libraries for the Win7 x86 core. The kit's toolchain
  # is MinGW/MSVCRT, so they are built on Linux with the matching mingw-w64
  # cross compiler; both are C libraries, so no C++ runtime crosses the line.
  # Without them the Win7 core is tiles-only (no VP9/VP8/AV1 stream at all).
  win7-codecs:
    runs-on: ubuntu-latest
    steps:
      - name: Install i686 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 nasm curl

      - name: Build libvpx 1.15.0 (i686, static)
        run: |
          curl -sSL --retry 5 -o libvpx.tar.gz \
            https://github.com/webmproject/libvpx/archive/refs/tags/v1.15.0.tar.gz
          tar xzf libvpx.tar.gz
          mv libvpx-1.15.0 libvpx
          cd libvpx
          CROSS=i686-w64-mingw32- ./configure --target=x86-win32-gcc --as=nasm \
            --disable-shared --enable-static --disable-examples --disable-tools \
            --disable-docs --disable-unit-tests --disable-webm-io --disable-libyuv
          make -j"$(nproc)"

      - name: Build dav1d 1.4.3 (i686, static)
        run: |
          python3 -m pip install --user meson ninja
          export PATH="$HOME/.local/bin:$PATH"
          curl -sSL --retry 5 -o dav1d.tar.gz \
            https://code.videolan.org/videolan/dav1d/-/archive/1.4.3/dav1d-1.4.3.tar.gz
          tar xzf dav1d.tar.gz
          cat > i686-cross.txt <<'EOF'
          [binaries]
          c = 'i686-w64-mingw32-gcc'
          ar = 'i686-w64-mingw32-ar'
          strip = 'i686-w64-mingw32-strip'
          windres = 'i686-w64-mingw32-windres'
          [host_machine]
          system = 'windows'
          cpu_family = 'x86'
          cpu = 'i686'
          endian = 'little'
          EOF
          meson setup dav1d-build dav1d-1.4.3 --cross-file i686-cross.txt \
            -Dbuildtype=release -Denable_asm=false -Denable_tools=false \
            -Denable_tests=false -Ddefault_library=static
          ninja -C dav1d-build

      - name: Package the codec prefix
        run: |
          mkdir -p out/include/dav1d out/include/vpx out/lib
          cp libvpx/vpx/*.h out/include/vpx/
          cp libvpx/vpx_config.h libvpx/vpx_version.h out/include/
          cp dav1d-1.4.3/include/dav1d/*.h out/include/dav1d/
          cp dav1d-build/include/dav1d/version.h out/include/dav1d/
          cp libvpx/libvpx.a dav1d-build/src/libdav1d.a out/lib/
          tar czf win7-codecs.tar.gz -C out .

      - uses: actions/upload-artifact@v4
        with:
          name: win7-codecs
          path: win7-codecs.tar.gz

  win7-x86:
    # The codec artifact must exist before this job starts; without `needs`
    # download-artifact runs immediately and fails with "Artifact not found".
    needs: win7-codecs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Fetch the cross-built codecs
        uses: actions/download-artifact@v4
        with:
          name: win7-codecs
          path: ${{ runner.temp }}/codecs

      - name: Extract the codecs
        shell: pwsh
        run: |
          tar -xzf "$env:RUNNER_TEMP\codecs\win7-codecs.tar.gz" `
            -C "$env:RUNNER_TEMP\codecs"
          Get-ChildItem "$env:RUNNER_TEMP\codecs\lib"

      # The 1.8.5 kit supplies cmake/make, the zlib static library and a
      # prebuilt/ prefix with the full/webapp profile, so libuvcpp is not
      # rebuilt from source. GCC 13 i686 remains the compiler.
      - name: Fetch the libuvcpp 1.8.5 kit
        shell: pwsh
        run: |
          $url = 'https://github.com/Antruly/libuvcpp/releases/download/v1.8.5/uvcpp-kit-1.8.5-mingw32.zip'
          Invoke-WebRequest -Uri $url -OutFile kit.zip
          Expand-Archive kit.zip -DestinationPath kit

      - name: Fetch GCC 13 i686
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          $url = 'https://github.com/niXman/mingw-builds-binaries/releases/download/13.2.0-rt_v11-rev1/i686-13.2.0-release-posix-dwarf-msvcrt-rt_v11-rev1.7z'
          Invoke-WebRequest -Uri $url -OutFile gcc13.7z
          & 'C:\Program Files\7-Zip\7z.exe' x gcc13.7z -ogcc13 -y | Out-Null

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Win7 x86 package
        shell: pwsh
        run: |
          $version = '${{ env.PKG_VERSION }}' -replace '^v',''
          ./packaging/windows/build-win7-x86.ps1 `
            -Kit "$PWD\kit\libuvcpp-1.8.5-mingw32" `
            -Gcc "$PWD\gcc13\mingw32" `
            -VpxPrefix "$env:RUNNER_TEMP\codecs" `
            -Dav1dPrefix "$env:RUNNER_TEMP\codecs" `
            -NativeOnly `
            -Version $version `
            -Out "$PWD\build\package"

      - name: Verify the two x86 artifacts
        shell: pwsh
        run: |
          $version = '${{ env.PKG_VERSION }}' -replace '^v',''
          $expected = @(
            "build\package\moLink-$version-native-setup-x86.exe",
            "build\package\moLink-$version-native-portable-x86.zip"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) {
              throw "missing Win7 x86 artifact: $path"
            }
          }
          Get-ChildItem build\package | Format-Table Name,Length

      - name: Smoke test the packaged core
        shell: pwsh
        run: |
          $exe = 'build\molink-win7-x86\molink-core.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'molink-core --version failed' }
          $out = Join-Path $env:RUNNER_TEMP 'core.out'
          $err = Join-Path $env:RUNNER_TEMP 'core.err'
          $p = Start-Process $exe `
            -ArgumentList '--host 127.0.0.1 --port 0 --no-capture --no-input --print-ready' `
            -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $ready = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 250
            if ((Test-Path $out) -and ((Get-Content $out -Raw) -match '"event":"ready"')) {
              $ready = $true
              break
            }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ready) {
            Get-Content $out, $err -ErrorAction SilentlyContinue
            throw 'the packaged core did not report ready'
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moLink-win7-x86
          if-no-files-found: error
          path: |
            build/package/*native-portable-x86.zip
            build/package/*native-setup-x86.exe

      - name: Attach to the shared release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          overwrite_files: true
          files: |
            build/package/*native-portable-x86.zip
            build/package/*native-setup-x86.exe
