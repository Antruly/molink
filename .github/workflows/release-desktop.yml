name: Release Desktop

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    # The Linux shell uses GTK 3 + WebKitGTK 4.1. Windows and macOS need their
    # own native shells (WebView2 / WKWebView) and are not built yet.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgtk-3-dev libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf libuv1-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # libuvcpp is not packaged by the distributions. Set the UVCPP_REPO
      # repository variable (and optionally UVCPP_REF) to its git location.
      - name: Build libuvcpp
        shell: bash
        run: |
          if [ -z "${{ vars.UVCPP_REPO }}" ]; then
            echo "::error::Set the UVCPP_REPO repository variable to the libuvcpp git URL."
            exit 1
          fi
          REF="${{ vars.UVCPP_REF }}"
          REF="${REF:-main}"
          git clone --depth 1 --branch "$REF" "${{ vars.UVCPP_REPO }}" "$RUNNER_TEMP/libuvcpp"
          cmake -S "$RUNNER_TEMP/libuvcpp" -B "$RUNNER_TEMP/libuvcpp/build" \
            -DUVCPP_BUILD_WEB=ON \
            -DUVCPP_BUILD_WEBAPP=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp"
          cmake --build "$RUNNER_TEMP/libuvcpp/build" --config Release --parallel
          cmake --install "$RUNNER_TEMP/libuvcpp/build" --config Release

      - name: Build core, frontend, shell and the .deb
        env:
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/uvcpp
          UVCPP_LIB_DIR: ${{ runner.temp }}/uvcpp/lib
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          export VERSION
          ./packaging/linux/build-deb.sh

      - name: Attach the .deb to the release
        uses: softprops/action-gh-release@v2
        with:
          name: moLink ${{ github.ref_name }}
          body: |
            Linux package (.deb). Windows and macOS shells are not built yet.
          files: build/package/*.deb
