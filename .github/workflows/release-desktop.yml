name: Release Desktop

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Every job builds libuvcpp from the UVCPP_REPO repository variable, then the
# core, frontend and the platform shell. Artifacts are attached to the release.
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgtk-3-dev libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf libuv1-dev curl

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build libuvcpp
        shell: bash
        run: |
          if [ -z "${{ vars.UVCPP_REPO }}" ]; then
            echo "::error::Set the UVCPP_REPO repository variable."
            exit 1
          fi
          REF="${{ vars.UVCPP_REF }}"; REF="${REF:-main}"
          git clone --depth 1 --branch "$REF" "${{ vars.UVCPP_REPO }}" "$RUNNER_TEMP/libuvcpp"
          cmake -S "$RUNNER_TEMP/libuvcpp" -B "$RUNNER_TEMP/libuvcpp/build" \
            -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp"
          cmake --build "$RUNNER_TEMP/libuvcpp/build" --parallel
          cmake --install "$RUNNER_TEMP/libuvcpp/build"

      - name: Build packages
        env:
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/uvcpp
          UVCPP_LIB_DIR: ${{ runner.temp }}/uvcpp/lib
          VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          ./packaging/linux/build-deb.sh
          ./packaging/linux/build-appimage.sh

      - uses: softprops/action-gh-release@v2
        with:
          name: moLink ${{ github.ref_name }}
          body: 'Linux packages: .deb and .AppImage.'
          files: |
            build/package/*.deb
            build/package/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build libuvcpp
        shell: bash
        run: |
          if [ -z "${{ vars.UVCPP_REPO }}" ]; then
            echo "::error::Set the UVCPP_REPO repository variable."
            exit 1
          fi
          REF="${{ vars.UVCPP_REF }}"; REF="${REF:-main}"
          git clone --depth 1 --branch "$REF" "${{ vars.UVCPP_REPO }}" "$RUNNER_TEMP/libuvcpp"
          cmake -S "$RUNNER_TEMP/libuvcpp" -B "$RUNNER_TEMP/libuvcpp/build" \
            -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp"
          cmake --build "$RUNNER_TEMP/libuvcpp/build" --config Release --parallel
          cmake --install "$RUNNER_TEMP/libuvcpp/build" --config Release

      - name: Install libuv and zlib into the prefix
        shell: bash
        run: |
          git clone --depth 1 https://github.com/libuv/libuv.git "$RUNNER_TEMP/libuv"
          cmake -S "$RUNNER_TEMP/libuv" -B "$RUNNER_TEMP/libuv/build" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp" -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/libuv/build" --config Release --target install
          git clone --depth 1 https://github.com/madler/zlib.git "$RUNNER_TEMP/zlib"
          cmake -S "$RUNNER_TEMP/zlib" -B "$RUNNER_TEMP/zlib/build" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp"
          cmake --build "$RUNNER_TEMP/zlib/build" --config Release --target install

      - name: Build core
        shell: bash
        run: |
          cmake -S backend -B backend/build -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/uvcpp"
          cmake --build backend/build --config Release --parallel

      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          $version = '1.0.4258.31'
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg"
          Invoke-WebRequest -Uri $url -OutFile wv2.zip
          Expand-Archive wv2.zip -DestinationPath wv2

      - name: Build shell
        shell: bash
        run: |
          cmake -S shell/windows -B shell/windows/build \
            -DWEBVIEW2_SDK="$(cygpath -w "$GITHUB_WORKSPACE/wv2")"
          cmake --build shell/windows/build --config Release --parallel

      - name: Stage and build installer
        shell: bash
        run: |
          export UVCPP_LIB_DIR="$(cygpath -u "$RUNNER_TEMP/uvcpp/bin")"
          bash packaging/windows/stage.sh
          choco install nsis -y --no-progress
          mkdir -p build/package
          VERSION="${GITHUB_REF_NAME#v}"
          MSYS2_ARG_CONV_EXCL='*' MSYS_NO_PATHCONV=1 \
            "/c/Program Files (x86)/NSIS/makensis.exe" /DVERSION="$VERSION" \
            /DPKG_DIR="$(cygpath -w "$GITHUB_WORKSPACE/build/windows/pkg")" \
            /DOUT_DIR="$(cygpath -w "$GITHUB_WORKSPACE/build/package")" \
            packaging/windows/installer.nsi

      - uses: softprops/action-gh-release@v2
        with:
          name: moLink ${{ github.ref_name }}
          body: 'Windows installer (x64).'
          files: build/package/*.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build libuvcpp
        shell: bash
        run: |
          if [ -z "${{ vars.UVCPP_REPO }}" ]; then
            echo "::error::Set the UVCPP_REPO repository variable."
            exit 1
          fi
          REF="${{ vars.UVCPP_REF }}"; REF="${REF:-main}"
          git clone --depth 1 --branch "$REF" "${{ vars.UVCPP_REPO }}" "$RUNNER_TEMP/libuvcpp"
          cmake -S "$RUNNER_TEMP/libuvcpp" -B "$RUNNER_TEMP/libuvcpp/build" \
            -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp"
          cmake --build "$RUNNER_TEMP/libuvcpp/build" --parallel
          cmake --install "$RUNNER_TEMP/libuvcpp/build"

      - name: Install libuv into the prefix
        shell: bash
        run: |
          git clone --depth 1 https://github.com/libuv/libuv.git "$RUNNER_TEMP/libuv"
          cmake -S "$RUNNER_TEMP/libuv" -B "$RUNNER_TEMP/libuv/build" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp" -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/libuv/build" --target install

      - name: Build app and dmg
        env:
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/uvcpp
          UVCPP_LIB_DIR: ${{ runner.temp }}/uvcpp/lib
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          export VERSION="${VERSION#v}"
          ./packaging/macos/build-dmg.sh

      - uses: softprops/action-gh-release@v2
        with:
          name: moLink ${{ github.ref_name }}
          body: 'macOS disk image.'
          files: build/package/*.dmg
