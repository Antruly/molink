name: Release Server

on:
  push:
    tags: ['server-v*']

permissions:
  contents: write

# Server releases use their own tag line (`server-v*`). Every job builds
# libuvcpp with the DB module, then molink-server and the admin SPA.
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libpq-dev libuv1-dev \
            zlib1g-dev pkg-config curl rpm

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: server/ui/pnpm-lock.yaml

      - name: Build libuvcpp (web + DB + OpenSSL)
        shell: bash
        run: |
          if [ -z "${{ vars.UVCPP_REPO }}" ]; then
            echo "::error::Set the UVCPP_REPO repository variable."
            exit 1
          fi
          REF="${{ vars.UVCPP_REF }}"; REF="${REF:-master}"
          ./packaging/clone-retry.sh --depth 1 --branch "$REF" "${{ vars.UVCPP_REPO }}" "$RUNNER_TEMP/libuvcpp"
          cmake -S "$RUNNER_TEMP/libuvcpp" -B "$RUNNER_TEMP/libuvcpp/build" \
            -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
            -DUVCPP_ENABLE_OPENSSL=ON \
            -DUVCPP_ENABLE_DB=ON \
            -DUVCPP_ENABLE_DB_SQLITE=ON \
            -DUVCPP_DB_SQLITE_FROM_SOURCE=ON \
            -DUVCPP_ENABLE_DB_PGSQL=ON \
            -DUVCPP_DB_RUNTIME_LOAD=ON \
            -DUVCPP_ENABLE_DB_MYSQL=OFF \
            -DUVCPP_ENABLE_DB_ODBC=OFF \
            -DUVCPP_ENABLE_DB_MONGODB=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp"
          cmake --build "$RUNNER_TEMP/libuvcpp/build" --parallel
          cmake --install "$RUNNER_TEMP/libuvcpp/build"
          cfg="$RUNNER_TEMP/uvcpp/include/uvcpp/uvcpp_config.h"
          for macro in UVCPP_OPENSSL_ENABLE UVCPP_DB_ENABLE \
                       UVCPP_DB_SQLITE_ENABLE UVCPP_DB_PGSQL_ENABLE; do
            grep -qE "^#[[:space:]]*define[[:space:]]+$macro[[:space:]]+1" "$cfg" || {
              echo "::error::$macro is not enabled in libuvcpp"
              exit 1
            }
          done

      - name: Build and test molink-server
        shell: bash
        run: |
          cmake -S server -B server/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/uvcpp" -DBUILD_TESTING=ON
          cmake --build server/build --parallel
          ctest --test-dir server/build --output-on-failure

      - name: Build admin UI
        working-directory: server/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build packages
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION#server-v}"
          export CMAKE_PREFIX_PATH="$RUNNER_TEMP/uvcpp"
          export UVCPP_LIB_DIR="$RUNNER_TEMP/uvcpp/lib"
          export OUT_DIR="$GITHUB_WORKSPACE/build/package"
          ./packaging/linux/build-server-deb.sh
          ./packaging/linux/build-server-rpm.sh
          ./packaging/linux/build-server-tar.sh

      - uses: softprops/action-gh-release@v2
        with:
          name: moLink Server ${{ github.ref_name }}
          overwrite: true
          body: 'Linux server packages: .deb, .rpm and tar.gz.'
          files: |
            build/package/*.deb
            build/package/*.rpm
            build/package/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: server/ui/pnpm-lock.yaml

      - name: Install OpenSSL and locate it
        shell: pwsh
        run: |
          choco install openssl -y --no-progress
          $roots = @(
            'C:\Program Files\OpenSSL-Win64',
            'C:\Program Files\OpenSSL'
          ) | Where-Object { Test-Path $_ }
          if (-not $roots) {
            $roots = Get-ChildItem 'C:\Program Files' -Directory -Filter 'OpenSSL*' |
              ForEach-Object { $_.FullName }
          }
          $root = @($roots)[0]
          if (-not $root) { throw 'OpenSSL installation not found' }
          "OPENSSL_ROOT_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_BIN=$root\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build libuvcpp (web + DB + OpenSSL)
        shell: bash
        run: |
          if [ -z "${{ vars.UVCPP_REPO }}" ]; then
            echo "::error::Set the UVCPP_REPO repository variable."
            exit 1
          fi
          REF="${{ vars.UVCPP_REF }}"; REF="${REF:-master}"
          ./packaging/clone-retry.sh --depth 1 --branch "$REF" "${{ vars.UVCPP_REPO }}" "$RUNNER_TEMP/libuvcpp"
          cmake -S "$RUNNER_TEMP/libuvcpp" -B "$RUNNER_TEMP/libuvcpp/build" \
            -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
            -DUVCPP_ENABLE_OPENSSL=ON \
            -DUVCPP_ENABLE_DB=ON \
            -DUVCPP_ENABLE_DB_SQLITE=ON \
            -DUVCPP_DB_SQLITE_FROM_SOURCE=ON \
            -DUVCPP_ENABLE_DB_PGSQL=ON \
            -DUVCPP_DB_RUNTIME_LOAD=ON \
            -DUVCPP_DB_PGSQL_INCLUDE_DIR="$GITHUB_WORKSPACE/server/third_party/postgresql" \
            -DUVCPP_ENABLE_DB_MYSQL=OFF \
            -DUVCPP_ENABLE_DB_ODBC=OFF \
            -DUVCPP_ENABLE_DB_MONGODB=OFF \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp"
          cmake --build "$RUNNER_TEMP/libuvcpp/build" --config Release --parallel
          cmake --install "$RUNNER_TEMP/libuvcpp/build" --config Release
          cfg="$RUNNER_TEMP/uvcpp/include/uvcpp/uvcpp_config.h"
          for macro in UVCPP_OPENSSL_ENABLE UVCPP_DB_ENABLE \
                       UVCPP_DB_SQLITE_ENABLE UVCPP_DB_PGSQL_ENABLE; do
            grep -qE "^#[[:space:]]*define[[:space:]]+$macro[[:space:]]+1" "$cfg" || {
              echo "::error::$macro is not enabled in libuvcpp"
              exit 1
            }
          done

      - name: Install libuv and zlib into the prefix
        shell: bash
        run: |
          ./packaging/clone-retry.sh --depth 1 https://github.com/libuv/libuv.git "$RUNNER_TEMP/libuv"
          cmake -S "$RUNNER_TEMP/libuv" -B "$RUNNER_TEMP/libuv/build" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp" -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/libuv/build" --config Release --target install
          ./packaging/clone-retry.sh --depth 1 https://github.com/madler/zlib.git "$RUNNER_TEMP/zlib"
          cmake -S "$RUNNER_TEMP/zlib" -B "$RUNNER_TEMP/zlib/build" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp"
          cmake --build "$RUNNER_TEMP/zlib/build" --config Release --target install

      - name: Build molink-server
        shell: bash
        run: |
          cmake -S server -B server/build \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/uvcpp" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"
          cmake --build server/build --config Release --parallel

      - name: Build admin UI
        working-directory: server/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Stage and build packages
        shell: bash
        run: |
          export VERSION="${GITHUB_REF_NAME#server-v}"
          PKG_DIR="$(cygpath -u "$GITHUB_WORKSPACE/build/windows/server-pkg")"
          OUT_DIR="$(cygpath -w "$GITHUB_WORKSPACE/build/package")"
          UVCPP_LIB_DIR="$(cygpath -u "$RUNNER_TEMP/uvcpp/bin")" \
          OPENSSL_BIN="$(cygpath -u "$OPENSSL_BIN")" \
          PKG_DIR="$PKG_DIR" \
            bash packaging/windows/server-stage.sh
          choco install innosetup -y --no-progress
          mkdir -p build/package
          ISCC=$(command -v iscc || true)
          if [ -z "$ISCC" ]; then
            ISCC=$(find "/c/Program Files (x86)" "/c/Program Files" \
              -maxdepth 2 -iname ISCC.exe 2>/dev/null | head -n 1)
          fi
          [ -n "$ISCC" ] || { echo "Inno Setup not found" >&2; exit 1; }
          LANG_FILE="$(cygpath -w "$GITHUB_WORKSPACE/packaging/windows/ChineseSimplified.isl")"
          MSYS2_ARG_CONV_EXCL='*' MSYS_NO_PATHCONV=1 \
            "$ISCC" /DAppVersion="$VERSION" \
            /DPkgDir="$(cygpath -w "$PKG_DIR")" \
            /DOutputDir="$OUT_DIR" /DLangFile="$LANG_FILE" \
            packaging/windows/server-installer.iss
          powershell -NoProfile -ExecutionPolicy Bypass \
            -File packaging/windows/server-zip.ps1 \
            -PkgDir "$(cygpath -w "$PKG_DIR")" -OutDir "$OUT_DIR" \
            -Version "$VERSION"

      - uses: softprops/action-gh-release@v2
        with:
          name: moLink Server ${{ github.ref_name }}
          overwrite: true
          body: 'Windows server installer (optional Windows service) and portable zip.'
          files: |
            build/package/*.exe
            build/package/*.zip

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: server/ui/pnpm-lock.yaml

      - name: Install dependencies
        run: brew install openssl@3 libpq libuv

      - name: Build libuvcpp (web + DB + OpenSSL)
        shell: bash
        run: |
          if [ -z "${{ vars.UVCPP_REPO }}" ]; then
            echo "::error::Set the UVCPP_REPO repository variable."
            exit 1
          fi
          REF="${{ vars.UVCPP_REF }}"; REF="${REF:-master}"
          OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          PGSQL_INCLUDE="$(brew --prefix libpq)/include"
          ./packaging/clone-retry.sh --depth 1 --branch "$REF" "${{ vars.UVCPP_REPO }}" "$RUNNER_TEMP/libuvcpp"
          cmake -S "$RUNNER_TEMP/libuvcpp" -B "$RUNNER_TEMP/libuvcpp/build" \
            -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
            -DUVCPP_ENABLE_OPENSSL=ON \
            -DUVCPP_ENABLE_DB=ON \
            -DUVCPP_ENABLE_DB_SQLITE=ON \
            -DUVCPP_DB_SQLITE_FROM_SOURCE=ON \
            -DUVCPP_ENABLE_DB_PGSQL=ON \
            -DUVCPP_DB_RUNTIME_LOAD=ON \
            -DUVCPP_DB_PGSQL_INCLUDE_DIR="$PGSQL_INCLUDE" \
            -DUVCPP_ENABLE_DB_MYSQL=OFF \
            -DUVCPP_ENABLE_DB_ODBC=OFF \
            -DUVCPP_ENABLE_DB_MONGODB=OFF \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp"
          cmake --build "$RUNNER_TEMP/libuvcpp/build" --parallel
          cmake --install "$RUNNER_TEMP/libuvcpp/build"
          cfg="$RUNNER_TEMP/uvcpp/include/uvcpp/uvcpp_config.h"
          for macro in UVCPP_OPENSSL_ENABLE UVCPP_DB_ENABLE \
                       UVCPP_DB_SQLITE_ENABLE UVCPP_DB_PGSQL_ENABLE; do
            grep -qE "^#[[:space:]]*define[[:space:]]+$macro[[:space:]]+1" "$cfg" || {
              echo "::error::$macro is not enabled in libuvcpp"
              exit 1
            }
          done

      - name: Install libuv into the prefix
        shell: bash
        run: |
          ./packaging/clone-retry.sh --depth 1 https://github.com/libuv/libuv.git "$RUNNER_TEMP/libuv"
          cmake -S "$RUNNER_TEMP/libuv" -B "$RUNNER_TEMP/libuv/build" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp" -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/libuv/build" --parallel --target install

      - name: Build molink-server and UI
        shell: bash
        run: |
          OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake -S server -B server/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/uvcpp" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"
          cmake --build server/build --parallel
          (cd server/ui && pnpm install --frozen-lockfile && pnpm build)

      - name: Build packages
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          export VERSION="${VERSION#server-v}"
          export CMAKE_PREFIX_PATH="$RUNNER_TEMP/uvcpp"
          export UVCPP_LIB_DIR="$RUNNER_TEMP/uvcpp/lib"
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          export OUT_DIR="$GITHUB_WORKSPACE/build/package"
          ./packaging/macos/build-server-pkg.sh
          ./packaging/macos/build-server-tar.sh

      - uses: softprops/action-gh-release@v2
        with:
          name: moLink Server ${{ github.ref_name }}
          overwrite: true
          body: 'macOS server package (unsigned) and tar.gz.'
          files: |
            build/package/*.pkg
            build/package/*.tar.gz
