name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  versions:
    # The version is copied into the core header, the web package, the native
    # shell and every packaging default. A missed copy made local Windows
    # artifacts say 0.10.6 after the source had already moved to 0.11.0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version sources agree
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error title=version-mismatch::$*"; exit 1; }
          core=$(sed -n 's/^#define MOLINK_VERSION "\(.*\)"/\1/p' backend/src/version.h)
          [ -n "$core" ] || fail "backend/src/version.h has no MOLINK_VERSION"
          frontend=$(python3 -c 'import json; print(json.load(open("frontend/package.json"))["version"])')
          [ "$frontend" = "$core" ] || fail "frontend/package.json=$frontend, version.h=$core"
          native=$(sed -n 's/.*kNativeVersion\[\] = L"\(.*\)";/\1/p' shell/windows/ui_kit_demo.cpp)
          [ "$native" = "$core" ] || fail "kNativeVersion=$native, version.h=$core"
          for f in packaging/linux/build-deb.sh packaging/linux/build-rpm.sh \
                   packaging/linux/build-appimage.sh packaging/macos/build-dmg.sh; do
            got=$(sed -n 's/.*VERSION:-\([0-9][0-9.]*\).*/\1/p' "$f" | head -1)
            [ "$got" = "$core" ] || fail "$f default VERSION=$got, version.h=$core"
          done
          for f in packaging/windows/installer.iss packaging/windows/win7-x86-installer.iss; do
            got=$(sed -n 's/^  #define AppVersion "\(.*\)"/\1/p' "$f" | head -1)
            [ "$got" = "$core" ] || fail "$f AppVersion=$got, version.h=$core"
          done
          got=$(sed -n 's/^  !define VERSION "\(.*\)"/\1/p' packaging/windows/portable.nsi | head -1)
          [ "$got" = "$core" ] || fail "portable.nsi VERSION=$got, version.h=$core"
          got=$(sed -n 's/.*\[string\]\$Version = "\(.*\)".*/\1/p' packaging/windows/build-win7-x86.ps1 | head -1)
          [ "$got" = "$core" ] || fail "build-win7-x86.ps1 default Version=$got, version.h=$core"
          got=$(grep -oE "ref_name \|\| '[0-9]+\.[0-9]+\.[0-9]+'" .github/workflows/release-desktop.yml \
                | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          [ "$got" = "$core" ] || fail "release-desktop PKG_VERSION fallback=$got, version.h=$core"
          echo "version sources agree: $core"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  protocol:
    # The wire protocol has no libuvcpp dependency, so it is testable on a
    # stock runner. MOLINK_BUILD_CORE=OFF skips the executable and its
    # libuvcpp lookup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S backend -B backend/build -DMOLINK_BUILD_CORE=OFF

      - name: Build
        run: cmake --build backend/build --config Release

      - name: Test
        run: ctest --test-dir backend/build --output-on-failure -C Release

  shell:
    # The desktop shell is C++/GTK/WebKitGTK; no Rust toolchain involved.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK and WebKitGTK development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgtk-3-dev libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Configure
        run: cmake -S shell/native -B shell/native/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build shell/native/build --parallel

  windows-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          $version = '1.0.4258.31'
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg"
          Invoke-WebRequest -Uri $url -OutFile wv2.zip
          Expand-Archive wv2.zip -DestinationPath wv2

      - name: Configure
        run: cmake -S shell/windows -B shell/windows/build -DWEBVIEW2_SDK=${{ github.workspace }}/wv2

      - name: Build
        run: cmake --build shell/windows/build --config Release

  macos-shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S shell/macos -B shell/macos/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build shell/macos/build --parallel

  windows-core:
    # Builds molink-core with MSVC against the prebuilt libuvcpp release, so
    # the Windows capture, input, transport and session backends are compiled
    # on every push and pull request. This is the only job that compiles those
    # sources; when it was main-only, a PR could change them with a green CI.
    runs-on: windows-latest
    env:
      UVCPP_VERSION: ${{ vars.UVCPP_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prebuilt libuvcpp
        shell: bash
        run: ./packaging/fetch-uvcpp.sh msvc-x64 "${UVCPP_VERSION:-1.9.1}" "$RUNNER_TEMP/uvcpp"

      # The archive has zlib.h but no zlib library; the core compresses tiles
      # itself, so build a static zlib to keep compression in the CI build.
      - name: Build zlib (static)
        shell: bash
        run: |
          ./packaging/clone-retry.sh --depth 1 --branch v1.3.1 \
            https://github.com/madler/zlib.git "$RUNNER_TEMP/zlib"
          cmake -S "$RUNNER_TEMP/zlib" -B "$RUNNER_TEMP/zlib/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/zlib/prefix"
          cmake --build "$RUNNER_TEMP/zlib/build" --config Release --target install

      - name: Build core
        shell: bash
        run: |
          cmake -S backend -B backend/build \
            -DMOLINK_UVCPP_PREFIX="$(cygpath -m "$RUNNER_TEMP/uvcpp")" \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DZLIB_INCLUDE_DIR="$(cygpath -m "$RUNNER_TEMP/zlib/prefix/include")" \
            -DZLIB_LIBRARY="$(cygpath -m "$RUNNER_TEMP/zlib/prefix/lib/zlibstatic.lib")"
          cmake --build backend/build --config Release --parallel

  macos-core:
    if: github.event_name != 'pull_request' && vars.UVCPP_REPO != ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build libuvcpp
        shell: bash
        run: |
          REF="${{ vars.UVCPP_REF }}"; REF="${REF:-master}"
          ./packaging/clone-retry.sh --depth 1 --branch "$REF" "${{ vars.UVCPP_REPO }}" "$RUNNER_TEMP/libuvcpp"
          cmake -S "$RUNNER_TEMP/libuvcpp" -B "$RUNNER_TEMP/libuvcpp/build" \
            -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
            -DUVCPP_ENABLE_OPENSSL=ON \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp"
          cmake --build "$RUNNER_TEMP/libuvcpp/build" --parallel
          cmake --install "$RUNNER_TEMP/libuvcpp/build"
          # The encrypted transports include libuvcpp's TLS headers; fail early
          # instead of at the core build when TLS was not compiled in.
          cfg="$RUNNER_TEMP/uvcpp/include/uvcpp/uvcpp_config.h"
          grep -qE "^#[[:space:]]*define[[:space:]]+UVCPP_OPENSSL_ENABLE[[:space:]]+1" "$cfg" || {
            echo "::error::UVCPP_OPENSSL_ENABLE is not enabled in libuvcpp"
            exit 1
          }

      - name: Install libuv into the prefix
        shell: bash
        run: |
          ./packaging/clone-retry.sh --depth 1 https://github.com/libuv/libuv.git "$RUNNER_TEMP/libuv"
          cmake -S "$RUNNER_TEMP/libuv" -B "$RUNNER_TEMP/libuv/build" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp" -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/libuv/build" --target install

      - name: Build core
        shell: bash
        run: |
          cmake -S backend -B backend/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/uvcpp"
          cmake --build backend/build --parallel

