name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  protocol:
    # The wire protocol has no libuvcpp dependency, so it is testable on a
    # stock runner. MOLINK_BUILD_CORE=OFF skips the executable and its
    # libuvcpp lookup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S backend -B backend/build -DMOLINK_BUILD_CORE=OFF

      - name: Build
        run: cmake --build backend/build --config Release

      - name: Test
        run: ctest --test-dir backend/build --output-on-failure -C Release

  shell:
    # The desktop shell is C++/GTK/WebKitGTK; no Rust toolchain involved.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK and WebKitGTK development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgtk-3-dev libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Configure
        run: cmake -S shell/native -B shell/native/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build shell/native/build --parallel

  windows-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          $version = '1.0.4258.31'
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg"
          Invoke-WebRequest -Uri $url -OutFile wv2.zip
          Expand-Archive wv2.zip -DestinationPath wv2

      - name: Configure
        run: cmake -S shell/windows -B shell/windows/build -DWEBVIEW2_SDK=${{ github.workspace }}/wv2

      - name: Build
        run: cmake --build shell/windows/build --config Release

  macos-shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S shell/macos -B shell/macos/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build shell/macos/build --parallel

  windows-core:
    # Builds libuvcpp and molink-core with MSVC so the Windows capture, input
    # and clipboard backends are compiled on every main push.
    if: github.event_name != 'pull_request' && vars.UVCPP_REPO != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build libuvcpp
        shell: bash
        run: |
          REF="${{ vars.UVCPP_REF }}"; REF="${REF:-master}"
          ./packaging/clone-retry.sh --depth 1 --branch "$REF" "${{ vars.UVCPP_REPO }}" "$RUNNER_TEMP/libuvcpp"
          cmake -S "$RUNNER_TEMP/libuvcpp" -B "$RUNNER_TEMP/libuvcpp/build" \
            -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp"
          cmake --build "$RUNNER_TEMP/libuvcpp/build" --config Release --parallel
          cmake --install "$RUNNER_TEMP/libuvcpp/build" --config Release

      - name: Install libuv and zlib into the prefix
        shell: bash
        run: |
          ./packaging/clone-retry.sh --depth 1 https://github.com/libuv/libuv.git "$RUNNER_TEMP/libuv"
          cmake -S "$RUNNER_TEMP/libuv" -B "$RUNNER_TEMP/libuv/build" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp" -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/libuv/build" --config Release --target install
          ./packaging/clone-retry.sh --depth 1 https://github.com/madler/zlib.git "$RUNNER_TEMP/zlib"
          cmake -S "$RUNNER_TEMP/zlib" -B "$RUNNER_TEMP/zlib/build" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp"
          cmake --build "$RUNNER_TEMP/zlib/build" --config Release --target install

      - name: Build core
        shell: bash
        run: |
          cmake -S backend -B backend/build -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/uvcpp"
          cmake --build backend/build --config Release --parallel

  macos-core:
    if: github.event_name != 'pull_request' && vars.UVCPP_REPO != ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build libuvcpp
        shell: bash
        run: |
          REF="${{ vars.UVCPP_REF }}"; REF="${REF:-master}"
          ./packaging/clone-retry.sh --depth 1 --branch "$REF" "${{ vars.UVCPP_REPO }}" "$RUNNER_TEMP/libuvcpp"
          cmake -S "$RUNNER_TEMP/libuvcpp" -B "$RUNNER_TEMP/libuvcpp/build" \
            -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp"
          cmake --build "$RUNNER_TEMP/libuvcpp/build" --parallel
          cmake --install "$RUNNER_TEMP/libuvcpp/build"

      - name: Install libuv into the prefix
        shell: bash
        run: |
          ./packaging/clone-retry.sh --depth 1 https://github.com/libuv/libuv.git "$RUNNER_TEMP/libuv"
          cmake -S "$RUNNER_TEMP/libuv" -B "$RUNNER_TEMP/libuv/build" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp" -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/libuv/build" --target install

      - name: Build core
        shell: bash
        run: |
          cmake -S backend -B backend/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/uvcpp"
          cmake --build backend/build --parallel

  server:
    # Builds libuvcpp with the DB module, then molink-server and its admin SPA.
    if: github.event_name != 'pull_request' && vars.UVCPP_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libpq-dev libuv1-dev \
            zlib1g-dev pkg-config

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: server/ui/pnpm-lock.yaml

      - name: Build libuvcpp (web + DB + OpenSSL)
        shell: bash
        run: |
          REF="${{ vars.UVCPP_REF }}"; REF="${REF:-master}"
          ./packaging/clone-retry.sh --depth 1 --branch "$REF" "${{ vars.UVCPP_REPO }}" "$RUNNER_TEMP/libuvcpp"
          cmake -S "$RUNNER_TEMP/libuvcpp" -B "$RUNNER_TEMP/libuvcpp/build" \
            -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
            -DUVCPP_ENABLE_OPENSSL=ON \
            -DUVCPP_ENABLE_DB=ON \
            -DUVCPP_ENABLE_DB_SQLITE=ON \
            -DUVCPP_DB_SQLITE_FROM_SOURCE=ON \
            -DUVCPP_ENABLE_DB_PGSQL=ON \
            -DUVCPP_DB_RUNTIME_LOAD=ON \
            -DUVCPP_ENABLE_DB_MYSQL=OFF \
            -DUVCPP_ENABLE_DB_ODBC=OFF \
            -DUVCPP_ENABLE_DB_MONGODB=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp"
          cmake --build "$RUNNER_TEMP/libuvcpp/build" --parallel
          cmake --install "$RUNNER_TEMP/libuvcpp/build"
          cfg="$RUNNER_TEMP/uvcpp/include/uvcpp/uvcpp_config.h"
          for macro in UVCPP_OPENSSL_ENABLE UVCPP_DB_ENABLE \
                       UVCPP_DB_SQLITE_ENABLE UVCPP_DB_PGSQL_ENABLE; do
            grep -qE "^#[[:space:]]*define[[:space:]]+$macro[[:space:]]+1" "$cfg" || {
              echo "::error::$macro is not enabled in libuvcpp"
              exit 1
            }
          done

      - name: Build and test server
        shell: bash
        run: |
          cmake -S server -B server/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/uvcpp" -DBUILD_TESTING=ON
          cmake --build server/build --parallel
          ctest --test-dir server/build --output-on-failure

      - name: Build admin UI
        working-directory: server/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
