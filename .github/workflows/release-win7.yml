name: Release Win7 x86

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.8.1)'
        required: true
        default: '0.8.1'
  push:
    tags: ['win7-x86-v*']

permissions:
  contents: write

jobs:
  win7-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          $version = '1.0.4258.31'
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg"
          Invoke-WebRequest -Uri $url -OutFile wv2.zip
          Expand-Archive wv2.zip -DestinationPath wv2

      - name: Fetch the libuvcpp Win7 MinGW kit
        shell: pwsh
        run: |
          $url = 'https://github.com/Antruly/libuvcpp/releases/download/v1.8.3/uvcpp-kit-1.8.3-mingw32.zip'
          Invoke-WebRequest -Uri $url -OutFile kit.zip
          Expand-Archive kit.zip -DestinationPath kit

      - name: Fetch GCC 13 i686 and nlohmann/json
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          $url = 'https://github.com/niXman/mingw-builds-binaries/releases/download/13.2.0-rt_v11-rev1/i686-13.2.0-release-posix-dwarf-msvcrt-rt_v11-rev1.7z'
          Invoke-WebRequest -Uri $url -OutFile gcc13.7z
          & 'C:\Program Files\7-Zip\7z.exe' x gcc13.7z -ogcc13 -y | Out-Null
          $url = 'https://github.com/nlohmann/json/archive/refs/tags/v3.11.3.zip'
          Invoke-WebRequest -Uri $url -OutFile nlohmann.zip
          Expand-Archive nlohmann.zip -DestinationPath nlohmann
          New-Item -ItemType Directory -Force 'kit\libuvcpp-1.8.3-mingw32\deps\nlohmann' | Out-Null
          Copy-Item -Recurse -Force 'nlohmann\json-3.11.3\*' 'kit\libuvcpp-1.8.3-mingw32\deps\nlohmann\'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Win7 x86 package
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if ('${{ github.ref }}' -like 'refs/tags/win7-x86-v*') {
            $version = '${{ github.ref_name }}'.Substring(11)
          }
          ./packaging/windows/build-win7-x86.ps1 `
            -Kit "$PWD\kit\libuvcpp-1.8.3-mingw32" `
            -Gcc "$PWD\gcc13\mingw32" `
            -WebView2 "$PWD\wv2" `
            -Version $version `
            -Out "$PWD\build\package"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moLink-win7-x86
          path: |
            build/package/*win7-x86.zip
            build/package/*win7-x86-setup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/win7-x86-v')
        uses: softprops/action-gh-release@v2
        with:
          name: moLink Win7 x86 ${{ github.ref_name }}
          overwrite: true
          body: 'Windows 7 x86 (32-bit) preview: GDI capture core, optional secure-desktop service, WebView2 shell and browser-UI launcher.'
          files: |
            build/package/*win7-x86.zip
            build/package/*win7-x86-setup.exe
